[package]
name = "emulator"
version = "0.1.0"
authors = ["Andreas Coroiu <andreas.coroiu@gmail.com>"]
edition = "2021"
rust-version = "1.77"

# Host-only crate: minifb and tiny_http don't build for the embedded
# (RP2350) target, so this crate is desktop-only and built with a plain
# `cargo build` / `cargo test` / `cargo run --bin desktop` at the repo
# root -- no `--target` override needed.

[lib]
name = "emulator"
path = "src/lib.rs"

[[bin]]
name = "desktop"
path = "src/main.rs"

[dependencies]
pico-link-core = { path = "../core" }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
embedded-graphics = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minifb = "0.27"
tiny_http = "0.12"
image = { version = "0.25.6", default-features = false, features = ["png"] }
